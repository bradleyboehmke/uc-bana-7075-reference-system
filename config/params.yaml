# Rossmann Forecasting Configuration

data:
  raw_path: data/raw
  processed_path: data/processed

features:
  # The features the model uses. This list is the single source of truth:
  # training, validation, the API, and batch prediction all read it.
  model_features:
    # When: calendar patterns
    - DayOfWeek
    - Month
    - Week
    - Year
    # Store: what kind of store it is and who it competes with
    - StoreType
    - Assortment
    - CompetitionDistance
    # Promotions
    - Promo
    - Promo2
    - Promo2Active
    # Holidays
    - StateHoliday
    - SchoolHoliday
  categorical_features:
    - StoreType
    - Assortment
    - StateHoliday

training:
  holdout_days: 42  # Last 6 weeks are held out for evaluation

model:
  # One LightGBM model with fixed hyperparameters (no tuning).
  lightgbm:
    objective: regression
    num_leaves: 31
    learning_rate: 0.05
    num_boost_round: 500
    seed: 7075
    num_threads: 2  # Free Colab has 2 CPUs; a fixed count also keeps results reproducible
    verbose: -1

validation:
  max_rmspe: 0.20  # Maximum holdout RMSPE for promotion (the current model scores about 0.16)

mlflow:
  tracking_uri: ./mlruns
  experiment_name: rossmann-forecasting
  model_name: rossmann-model
  artifact_location: ./mlartifacts
  default_artifact_root: ./mlartifacts
  backend_store_uri: ./mlruns
  registry_uri: ./mlruns  # Model registry location
  server:
    host: 127.0.0.1
    port: 5000
